<!DOCTYPE html>
<html lang="en">

    <body>
        <header>
            <nav class="navegador_fijo">
                <h2><a href="index.html">HOME</a></h2>
                <h2>|</h2>
                <h2><a href="contacto.html">CONTACTO</a></h2>

            </nav>
        </header>
        <main>
            <section class="datos_personales">
                <form action>
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                     <div>
                        <label for="email">E-mal</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                     <div>
                        <label for="tel">Tel</label>
                        <input type="tel" id="tel" name="tel" required>
                    </div>
                     <div>
                        <label for="mensaje">Mensaje</label>
                        <textarea name="mensaje" id="mensaje" required></textarea>
                    </div>
                    <button class="botones" type="submit">Enviar</button>
                    <a href="index.html" class="botones">Cancelar</a>
                </form>
            </section>
        </main>
        <footer>TODOS LOS DERECHOS RESERVADOS</footer>

    </body>
